name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    name: 单元测试 (${{ matrix.websockets }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        websockets: ["websockets==15.0.1", "websockets"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install numpy rich "${{ matrix.websockets }}" colorama "pytest>=9.1.1" soundfile "pytest-asyncio>=1.4.0" "httpx==0.28.1"

      - name: 打印 websockets 版本
        run: python -c "import websockets; print(websockets.__version__)"

      - name: 运行 pytest
        run: python -m pytest tests/ -q
